<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><title>MetaWeb AI Auto Post</title><style>body{font-family:Arial;background:#0b1020;color:#fff;padding:20px}.box{max-width:700px;margin:auto;background:#111a2d;padding:22px;border-radius:18px}button,input{padding:12px;margin:7px 0;border-radius:9px}input{width:100%;box-sizing:border-box}</style></head><body><div class="box"><h1>MetaWeb AI Auto Post Manager</h1><p>Daily automatic post: <b>6:30 PM IST</b></p><input id="url" placeholder="Backend URL"><br><button onclick="health()">Test Backend</button> <button id="install" hidden>Install App</button><pre id="out"></pre><p>AI topic • AI image • Logo overlay • Caption • Hashtags • Facebook publishing • History</p><small>Production credentials must remain on the server.</small></div><script>let d;addEventListener("beforeinstallprompt",e=>{e.preventDefault();d=e;install.hidden=false});install.onclick=()=>d?.prompt();async function health(){try{let r=await fetch(url.value.replace(/\/$/,"")+"/api/health");out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent=e.message}}</script></body></html>
